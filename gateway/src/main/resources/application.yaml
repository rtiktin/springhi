server:
  port: ${PORT:9000}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGIN:http://localhost:5173}
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: backend
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
        - id: portfolio-service
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/portfolio/**
        - id: portfolios-service
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/portfolios/**
        - id: market-data
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/market/**
        - id: profile-service
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/profile/**
        - id: leaderboard-service
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/leaderboard/**
        - id: admin-users
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/users/**
        - id: admin-portfolios
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/portfolios/**
        - id: admin-stats-users
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/stats/users
        - id: admin-stats-portfolios
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/stats/portfolios
        - id: admin-stats-subscriptions
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/stats/subscriptions
        - id: admin-stats-subscriptions-daily
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/stats/subscriptions/daily
        - id: portfolios-usage-stats
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/portfolios/usage-stats
        - id: admin-subscription-config
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/subscription-config/**
        - id: subscription-service
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/subscription/**
        - id: support-service
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/support/**
        - id: admin-support
          uri: ${PORTFOLIO_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/support/**
