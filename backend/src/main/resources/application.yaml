spring:
  application:
    name: demo-web
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postf1?currentSchema=springhi}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:SNake118P}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: springhi
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:86400000}
  mail:
    from: ${MAIL_FROM:noreply@springhi.ai}
    reset-code-expiry-minutes: 15
  telnyx:
    api-key: ${TELNYX_API_KEY:}
    from-number: ${TELNYX_FROM_NUMBER:+15162000271}
app:
  referral:
    base-url: ${APP_REFERRAL_BASE_URL:http://localhost:5173}
    # Referral fee accrual + payout (Stripe Connect) configuration.
    # The internal append-only ledger (referral_commissions + referral_payouts) is the source of
    # truth; Stripe Connect is the payout rail only.
    commission-rate: ${APP_REFERRAL_COMMISSION_RATE:0.30}          # 30% of invoice subtotal ex-tax, post-discount
    payout-threshold: ${APP_REFERRAL_PAYOUT_THRESHOLD:50.00}       # pay full balance when >= threshold
    hold-days: ${APP_REFERRAL_HOLD_DAYS:31}                        # accrual PENDING -> LOCKED after N days
    min-live-referred: ${APP_REFERRAL_MIN_LIVE_REFERRED:2}         # >=N distinct live referred users before fees accrue
    referral-window-months: ${APP_REFERRAL_WINDOW_MONTHS:12}       # 12-month earning window from first paid invoice
    # Payout rail per referrer bucket, selected by the referrer's declared payout-profile country.
    # domestic = referrers in domestic-countries (default US); international = referrers everywhere
    # else. Each is "csv" (default) or "connect" (Stripe Connect Express; stubbed until platform
    # approval). Set both to "csv" to pay everyone via CSV (pre-approval default). Later, flip
    # domestic (or both) to "connect" to route those referrers through Stripe Connect.
    payout-method:
      domestic: ${APP_REFERRAL_PAYOUT_METHOD_DOMESTIC:csv}
      international: ${APP_REFERRAL_PAYOUT_METHOD_INTERNATIONAL:csv}
    # ISO-3166 countries treated as "domestic" for payout-rail selection (default US). Accrual is
    # not country-gated; country only selects the rail. The referrer declares their country in the
    # payout profile to set the rail.
    domestic-countries: ${APP_REFERRAL_DOMESTIC_COUNTRIES:US}
    click-flush-ms: ${APP_REFERRAL_CLICK_FLUSH_MS:60000}
    lock-cron: ${APP_REFERRAL_LOCK_CRON:0 30 3 * * *}              # 3:30 AM daily: mature PENDING -> LOCKED
    payout-cron: ${APP_REFERRAL_PAYOUT_CRON:0 0 0 L * *}          # last day of month, midnight
    taxid:
      secret: ${REFERRAL_TAXID_SECRET:dev-taxid-secret-change-me-to-32-bytes}
